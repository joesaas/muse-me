[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-me"
version = "0.1.0"
description = "类 Muse 个人 Agent Demo：Web 交互 + Agent 运行时适配层 + 完整 Harness 工程"
requires-python = ">=3.11"
dependencies = []

# 可选入口：AgentCore Agent 侧（src/muse_me/agentcore_app.py）。
# 主包仍零依赖；只有部署到 Bedrock AgentCore 时才装这组。
[project.optional-dependencies]
agentcore = ["bedrock-agentcore>=1.25"]

[tool.setuptools.packages.find]
where = ["src"]
