# MuseMe nginx 站点配置 —— 形态 B：控制面分离（server/，127.0.0.1:8787）
#
# 启用（在服务器上，仓库根目录）：
#   sudo cp deploy/nginx/museme-b.conf /etc/nginx/sites-available/museme
#   sudo ln -sf /etc/nginx/sites-available/museme /etc/nginx/sites-enabled/museme
#   sudo nginx -t && sudo systemctl reload nginx
#
# 配套关系：应用只监听回环地址（127.0.0.1），不直接对外；
# 安全组只需放行 80（与 443），8787 不用、也不应对外开。
# 形态 A 与 B 同一时刻只启用一个站点文件，不要两个都链进 sites-enabled。
# 注意：形态 B 的调度守护与形态 A 的 Python 调度不要同时常驻（见 DEPLOYMENT.md Step 2）。

server {
    listen 80;
    server_name _;  # 有域名后改成你的域名，例如 example.com

    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # SSE 事件流（/api/events）：必须关缓冲，否则事件会被 nginx 攒着不发，
    # 页面会表现为“发了消息但一直没动静”。
    location /api/events {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600;
        chunked_transfer_encoding on;
    }
}

# HTTPS（有域名后启用）：
#   1. 把上面 server_name 改成你的域名；
#   2. sudo certbot --nginx -d 你的域名   # certbot 会自动写好 443 段并加 80 跳 443；
#   3. sudo nginx -t && sudo systemctl reload nginx
# 在拿到证书前不要手写 443 段，避免证书路径不对导致 nginx 起不来。
